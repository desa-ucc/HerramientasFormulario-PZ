<div class="container">
  <div class="card">
    <div class="header">
      <h2>Solicitar archivos</h2>
      <p class="subtitle">Por favor seleccione un archivo para subir.</p>
    </div>

    <form [formGroup]="uploadForm" (ngSubmit)="onSubmit()" class="form-body">

      <!-- Zona de carga de archivos -->
      <div class="file-drop-area" *ngIf="!selectedFile; else fileSelected">
        <label for="fileInput" class="file-label">
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="upload-icon">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <span class="file-text">Seleccionar archivos</span>
        </label>
        <input type="file" id="fileInput" (change)="onFileSelected($event)" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" class="file-input">
      </div>

      <!-- Vista cuando el archivo está seleccionado -->
      <ng-template #fileSelected>
        <div class="selected-file-info">
          <div class="file-details">
            <span class="file-name">{{ selectedFile?.name }}</span>
            <button type="button" class="btn-remove" (click)="removeFile()" title="Remover archivo">✕</button>
          </div>

          <!-- Campos que aparecen SOLO después de seleccionar el archivo -->
          <div class="form-fields">
            <div class="form-group">
              <label for="nombre">Nombre *</label>
              <input type="text" id="nombre" formControlName="nombre" class="form-control" placeholder="Ej. Juan">
              <div *ngIf="uploadForm.get('nombre')?.invalid && uploadForm.get('nombre')?.touched" class="error-msg">
                El nombre es requerido.
              </div>
            </div>

            <div class="form-group">
              <label for="apellidos">Apellidos *</label>
              <input type="text" id="apellidos" formControlName="apellidos" class="form-control" placeholder="Ej. Pérez Gómez">
              <div *ngIf="uploadForm.get('apellidos')?.invalid && uploadForm.get('apellidos')?.touched" class="error-msg">
                Los apellidos son requeridos.
              </div>
            </div>
          </div>
        </div>
      </ng-template>

      <!-- Mensajes de estado -->
      <div *ngIf="uploadStatus === 'success'" class="status-message success">
        ¡Archivo enviado correctamente!
      </div>
      <div *ngIf="uploadStatus === 'error'" class="status-message error">
        Hubo un error al enviar el archivo. Por favor intente de nuevo.
      </div>

      <!-- Botón de envío -->
      <div class="form-footer" *ngIf="selectedFile">
        <button type="submit" class="btn-submit" [disabled]="uploadForm.invalid || uploadStatus === 'uploading'">
          <span *ngIf="uploadStatus !== 'uploading'">Cargar</span>
          <span *ngIf="uploadStatus === 'uploading'">Cargando...</span>
        </button>
      </div>

    </form>
  </div>
</div>
